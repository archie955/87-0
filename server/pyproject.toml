[project]
name = "87-0"
version = "0.0.1"
description = "Counter Strike Esports Game"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.4",
    "fastapi>=0.138.0",
    "httpx>=0.28.1",
    "psycopg>=3.3.4",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.14.2",
    "pydantic[email]>=2.13.4",
    "pyjwt>=2.13.0",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0.51",
    "uvicorn>=0.52.4",
]

[dependency-groups]
data = [
    "ipykernel>=7.3.0",
    "matplotlib>=3.11.1",
    "pandas>=3.0.3",
    "seaborn>=0.13.2",
]
dev = [
    { include-group = "data" },
    { include-group = "lint" },
    { include-group = "test" },
]
lint = [
    "pyrefly>=1.2.0",
    "ruff>=0.15.18",
]
test = [
    "pytest-asyncio>=1.4.0",
]



[tool.ruff]
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "old_ml",
    "redis_temp",
    "alembic",
    "database/init_players.py",
    "database/init_db.py",
    "database/init_teams.py",
]
line-length = 88
indent-width = 4
target-version = "py312"



[tool.ruff.lint]
select = [
    # pycodestyle errors
    "E",

    # pyflakes
    "F",

    # import sorting
    "I",

    # flake8 bugbear
    "B",

    # pyugrade
    "UP",

    # pydocstyle
    # "D",

    # pep8 naming
    "N",

    # flake8 bandit
    "S",

    # flake8 trailing comma
    "COM",

    # flake8 comprehensions
    "C4",

    # flake8 logging
    "LOG",
    "G",

    # flake8 print
    "T",

    # flake8 simplify
    "SIM",
    
    # flake8 async
    "ASYNC",

    # mccabe complexity
    "C90",

    # FastAPI response models, Annotation, path params
    "FAST",

    # flake8 2020
    "YTT",

    # flake8 blind except
    "BLE",

    # flake8 datetime
    "DTZ",

    # flake8 debugger
    "T10",

    # flake8 executable
    "EXE",

    # flake8 future Annotation
    "FA",

    # flake8 get text
    "INT",

    # flake8 implicit string concat
    "ISC",

    # flake8 pie
    "PIE",

    # flake8 pytest style
    "PT",

    # flake8 return
    "RET",

    # flake8 type checking
    "TC",

    # flake8 pathlib
    "PTH",

    # flynt
    "FLY",

    # perflint
    "PERF",

    # pycodestyle warnings
    "W",

    # pygrep hooks
    "PGH",

    # pylint
    "PL",

    # refurb
    "FURB",
    
    # ruff specific rules
    "RUF",

    # Tryceratops
    "TRY",
]

# to eventually include fastapi one when typing-annotated is sorted
ignore = [
    "incorrect-blank-line-before-class",
    "multi-line-summary-second-line",
    "missing-trailing-comma",
    "fast-api-non-annotated-dependency",
    "logging-f-string",
]
preview = true
fixable = ["ALL"]
unfixable = []
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"



[tool.ruff.lint.per-file-ignores]
"**/tests/*.py" = [
    "assert",
    "magic-value-comparison",
]



[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]



[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = false
docstring-code-line-length = "dynamic"



[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.pyrefly]
project-includes = [
    "**/*.py",
    "**/*.ipynb",
]
project-excludes = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "old_ml",
    "redis_temp",
    "alembic",
    "database/init_players.py",
    "database/init_db.py",
    "database/init_teams.py",
]
python-platform = "linux"
python-version = "3.12"
