services:
  db:
    image: postgres:16
    container_name: 87-0-db
    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USERNAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
        compress: "true"

    environment:
      POSTGRES_USER: ${POSTGRES_USERNAME}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_NAME}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - 87-0-net

  redis:
    image: redis:8.8
    container_name: 87-0-redis
    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 5

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
        compress: "true"

    networks:
      - 87-0-net

  backend:
    image: archie955/87-0-backend:latest
    container_name: 87-0-backend
    restart: unless-stopped

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "5"
        compress: "true"

    env_file:
      - .env

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

    environment:
      POSTGRES_HOSTNAME: db

    command: >
      sh -c "uv run alembic upgrade head &&
             uv run uvicorn main:app --host 0.0.0.0 --port 8000"

    networks:
      - 87-0-net

  frontend:
    image: archie955/87-0-frontend:latest
    container_name: 87-0-frontend
    restart: unless-stopped

    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
        compress: "true"

    depends_on:
      backend:
        condition: service_healthy

    networks:
      - 87-0-net

  caddy:
    image: caddy:2.10-alpine
    container_name: 87-0-caddy
    restart: unless-stopped

    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
        compress: "true"

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config

    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy

    networks:
      - 87-0-net

networks:
  87-0-net:
    driver: bridge

volumes:
  postgres_data:
  caddy_data:
  caddy_config: