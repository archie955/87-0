name: CI-deploy

on:
    push:
      paths:
        - "server/**"
        - "client/**"
        - "docker-compose.prod.yml"
        - ".github/workflows/ci.yml"
        - "Caddyfile"
        - ".github/dependabot.yml"
      branches: [ main ]
    pull_request:
      branches: [ main ]

concurrency:
    group: production-deploy
    cancel-in-progress: true

jobs:
    test:
        runs-on: ubuntu-latest

        services:
            postgres:
                image: postgres:16
                env:
                    POSTGRES_USER: ${{ secrets.POSTGRES_USERNAME }}
                    POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
                    POSTGRES_DB: test_db
                ports:
                  - 5433:5432
                options: >-
                  --health-cmd="pg_isready -U postgres"
                  --health-interval=10s
                  --health-timeout=5s
                  --health-retries=5
            redis:
              image: redis:8.8
              ports:
                - 6380:6379
        steps:
          - name: Checkout repo
            uses: actions/checkout@v6

          - name: Set up Python
            uses: actions/setup-python@v6
            with:
              python-version: "3.12"

          - name: Install uv
            uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
            with:
              version: "0.11.17"

          - name: Sync backend dependencies
            working-directory: server
            run: uv sync --no-default-groups --group dev

          - name: Audit dependencies
            working-directory: server
            run: uv audit --preview-features audit

          - name: Check backend formatting
            working-directory: server
            run: uv run ruff format --check .

          - name: Run backend linting
            working-directory: server
            run: uv run ruff check .

          - name: Run backend tests
            working-directory: server
            env:
              SECRET_KEY: ${{ secrets.SECRET_KEY }}
              POSTGRES_HOSTNAME: ${{ secrets.POSTGRES_HOSTNAME }}
              POSTGRES_USERNAME: ${{ secrets.POSTGRES_USERNAME }}
              POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
              POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
              POSTGRES_NAME: ${{ secrets.POSTGRES_NAME }}
              ALGORITHM: ${{ secrets.ALGORITHM }}
              ACCESS_TOKEN_EXPIRE_MINUTES: ${{ secrets.ACCESS_TOKEN_EXPIRE_MINUTES }}
              REFRESH_TOKEN_EXPIRE_DAYS: ${{ secrets.REFRESH_TOKEN_EXPIRE_DAYS }}
              ALLOWED_ORIGINS: ${{ secrets.ALLOWED_ORIGINS_TESTING }}
              STEAM_KEY: ${{ secrets.STEAM_KEY }}
              REDIS_HOST: ${{ secrets.REDIS_HOST }}
              REDIS_PORT: ${{ secrets.REDIS_PORT }}
              REDIS_DB: ${{ secrets.REDIS_DB }}
              PROD: ${{ secrets.DEV }}
              FRONTEND_AUTH_URL: ${{ secrets.FRONTEND_DEV_URL }}
              DATA_VERSION: ${{ vars.DATABASE_VERSION }}
            run: uv run pytest --cov-report=xml

          - name: Use Node.js
            uses: actions/setup-node@v6
            with:
              node-version: 24
              cache: npm
              cache-dependency-path: client/package-lock.json

          - name: Install frontend dependencies
            working-directory: client
            run: npm ci

          - name: Audit dependencies
            working-directory: client
            run: npm audit

          - name: Run frontend typecheck
            working-directory: client
            run: npm run tsc

          - name: Run frontend linting
            working-directory: client
            run: npm run lint

          - name: Check formatting
            working-directory: client
            run: npx prettier . --check

          - name: Run frontend tests
            working-directory: client
            run: npm run test
    build:
        needs: test
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repo
              uses: actions/checkout@v6

            - name: Install Cosign
              uses: sigstore/cosign-installer@v4.0.0

            - name: Login to Docker Hub
              uses: docker/login-action@v4
              with:
                username: ${{ vars.DOCKERHUB_USERNAME }}
                password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: Build backend image
              uses: docker/build-push-action@v7
              env:
                SECRET_KEY: ${{ secrets.SECRET_KEY }}
                POSTGRES_HOSTNAME: ${{ secrets.POSTGRES_HOSTNAME }}
                POSTGRES_USERNAME: ${{ secrets.POSTGRES_USERNAME }}
                POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
                POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
                POSTGRES_NAME: ${{ secrets.POSTGRES_NAME }}
                ALGORITHM: ${{ secrets.ALGORITHM }}
                ACCESS_TOKEN_EXPIRE_MINUTES: ${{ secrets.ACCESS_TOKEN_EXPIRE_MINUTES }}
                REFRESH_TOKEN_EXPIRE_DAYS: ${{ secrets.REFRESH_TOKEN_EXPIRE_DAYS }}
                ALLOWED_ORIGINS: ${{ secrets.ALLOWED_ORIGINS }}
                STEAM_KEY: ${{ secrets.STEAM_KEY }}
                REDIS_HOST: ${{ secrets.REDIS_HOST }}
                REDIS_PORT: ${{ secrets.REDIS_PORT }}
                REDIS_DB: ${{ secrets.REDIS_DB }}
                PROD: ${{ secrets.PROD }}
                FRONTEND_AUTH_URL: ${{ secrets.FRONTEND_AUTH_URL }}
                DATA_VERSION: ${{ vars.DATABASE_VERSION }}
              id: backend
              with:
                context: ./server
                push: true
                tags: |
                    ${{ vars.DOCKERHUB_USERNAME }}/87-0-backend:latest
                    ${{ vars.DOCKERHUB_USERNAME }}/87-0-backend:${{ github.sha }}

            - name: Build frontend image
              uses: docker/build-push-action@v7
              id: frontend
              with:
                context: ./client
                push: true
                tags: |
                    ${{ vars.DOCKERHUB_USERNAME }}/87-0-frontend:latest
                    ${{ vars.DOCKERHUB_USERNAME }}/87-0-frontend:${{ github.sha }}

            - name: Sign and verify backend image
              run: |
                IMAGE="${{ vars.DOCKERHUB_USERNAME }}/87-0-backend"
                DIGEST="${{ steps.backend.outputs.digest }}"

                cosign sign --yes "${IMAGE}@${DIGEST}"

                cosign verify "${IMAGE}@${DIGEST}" \
                  --certificate-identity-regexp 'https://github.com/archie955/87-0/.github/workflows/ci.yml@refs/heads/main' \
                  --certificate-oidc-issuer 'https://token.actions.githubusercontent.com'

            - name: Sign and verify frontend image
              run: |
                IMAGE="${{ vars.DOCKERHUB_USERNAME }}/87-0-frontend"
                DIGEST="${{ steps.frontend.outputs.digest }}"

                cosign sign --yes "${IMAGE}@${DIGEST}"

                cosign verify "${IMAGE}@${DIGEST}" \
                  --certificate-identity-regexp 'https://github.com/archie955/87-0/.github/workflows/ci.yml@refs/heads/main' \
                  --certificate-oidc-issuer 'https://token.actions.githubusercontent.com'
    
    deploy:
        needs: build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest

        steps:
            - name: Deploy to droplet
              uses: appleboy/ssh-action@v1.2.5
              with:
                host: ${{ secrets.DROPLET_IP }}
                username: ${{ secrets.DROPLET_USER }}
                key: ${{ secrets.DROPLET_SSH_KEY }}
                script: |
                    set -e

                    if ! command -v cosign &> /dev/null; then
                      curl -sSfL https://github.com/sigstore/cosign/releases/latest/download/cosign-linux-amd64 \
                        -o /usr/local/bin/cosign
                      chmod +x /usr/local/bin/cosign
                    fi

                    BACKEND_IMAGE="${{ vars.DOCKERHUB_USERNAME }}/87-0-backend"
                    FRONTEND_IMAGE="${{ vars.DOCKERHUB_USERNAME }}/87-0-frontend"

                    cosign verify "${BACKEND_IMAGE}:latest" \
                      --certificate-identity-regexp 'https://github.com/archie955/87-0/.github/workflows/ci.yml@refs/heads/main' \
                      --certificate-oidc-issuer 'https://token.actions.githubusercontent.com'

                    cosign verify "${FRONTEND_IMAGE}:latest" \
                      --certificate-identity-regexp 'https://github.com/archie955/87-0/.github/workflows/ci.yml@refs/heads/main' \
                      --certificate-oidc-issuer 'https://token.actions.githubusercontent.com'
                    
                    cd ../../opt/87-0
                    docker compose pull
                    docker compose up -d


