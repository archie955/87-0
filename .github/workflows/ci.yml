name: CI-deploy

on:
    push:
      paths:
        - "server/**"
        - "client/**"
        - "docker-compose.prod.yml"
        - ".github/workflows/ci.yml"
        - "Caddyfile"
      branches: [ main ]
    pull_request:
      branches: [ main ]

concurrency:
    group: production-deploy
    cancel-in-progress: true

jobs:
    test:
        runs-on: ubuntu-latest

        services:
            postgres:
                image: postgres:16
                env:
                    POSTGRES_USER: ${{ secrets.POSTGRES_USERNAME }}
                    POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
                    POSTGRES_DB: test_db
                ports:
                  - 5433:5432
                options: >-
                  --health-cmd="pg_isready -U postgres"
                  --health-interval=10s
                  --health-timeout=5s
                  --health-retries=5
            redis:
              image: redis:latest
              ports:
                - 6380:6379
        steps:
          - name: Checkout repo
            uses: actions/checkout@v6

          - name: Set up Python
            uses: actions/setup-python@v6
            with:
              python-version: "3.12"

          - name: Install uv
            uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
            with:
              version: "0.11.17"

          - name: Sync backend dependencies
            working-directory: server
            run: uv sync --group dev

          - name: Check backend formatting
            working-directory: server
            run: uv run ruff format --check .

          - name: Run backend linting
            working-directory: server
            run: uv run ruff check .

          - name: Run backend tests
            working-directory: server
            env:
              SECRET_KEY: ${{ secrets.SECRET_KEY }}
              POSTGRES_HOSTNAME: ${{ secrets.POSTGRES_HOSTNAME }}
              POSTGRES_USERNAME: ${{ secrets.POSTGRES_USERNAME }}
              POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
              POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
              POSTGRES_NAME: ${{ secrets.POSTGRES_NAME }}
              ALGORITHM: ${{ secrets.ALGORITHM }}
              ACCESS_TOKEN_EXPIRE_MINUTES: ${{ secrets.ACCESS_TOKEN_EXPIRE_MINUTES }}
              REFRESH_TOKEN_EXPIRE_DAYS: ${{ secrets.REFRESH_TOKEN_EXPIRE_DAYS }}
              ALLOWED_ORIGINS: ${{ secrets.ALLOWED_ORIGINS_TESTING }}
              STEAM_KEY: ${{ secrets.STEAM_KEY }}
              REDIS_HOST: ${{ secrets.REDIS_HOST }}
              REDIS_PORT: ${{ secrets.REDIS_PORT }}
              REDIS_DB: ${{ secrets.REDIS_DB }}
              PROD: ${{ secrets.DEV }}
              FRONTEND_AUTH_URL: ${{ secrets.FRONTEND_DEV_URL }}
            run: uv run pytest

          - name: Use Node.js
            uses: actions/setup-node@v6
            with:
              node-version: 24
              cache: npm
              cache-dependency-path: client/package-lock.json

          - name: Install frontend dependencies
            working-directory: client
            run: npm ci

          - name: Run frontend typecheck
            working-directory: client
            run: npm run type-check

          - name: Run frontend linting
            working-directory: client
            run: npm run lint

          - name: Run frontend tests
            working-directory: client
            run: npm run test -- --run
    build:
        needs: test
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repo
              uses: actions/checkout@v6

            - name: Login to Docker Hub
              uses: docker/login-action@v4
              with:
                username: ${{ vars.DOCKERHUB_USERNAME }}
                password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: Build backend image
              uses: docker/build-push-action@v7
              env:
                SECRET_KEY: ${{ secrets.SECRET_KEY }}
                POSTGRES_HOSTNAME: ${{ secrets.POSTGRES_HOSTNAME }}
                POSTGRES_USERNAME: ${{ secrets.POSTGRES_USERNAME }}
                POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
                POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
                POSTGRES_NAME: ${{ secrets.POSTGRES_NAME }}
                ALGORITHM: ${{ secrets.ALGORITHM }}
                ACCESS_TOKEN_EXPIRE_MINUTES: ${{ secrets.ACCESS_TOKEN_EXPIRE_MINUTES }}
                REFRESH_TOKEN_EXPIRE_DAYS: ${{ secrets.REFRESH_TOKEN_EXPIRE_DAYS }}
                ALLOWED_ORIGINS: ${{ secrets.ALLOWED_ORIGINS_TESTING }}
                STEAM_KEY: ${{ secrets.STEAM_KEY }}
                REDIS_HOST: ${{ secrets.REDIS_HOST }}
                REDIS_PORT: ${{ secrets.REDIS_PORT }}
                REDIS_DB: ${{ secrets.REDIS_DB }}
                PROD: ${{ secrets.DEV }}
                FRONTEND_AUTH_URL: ${{ secrets.FRONTEND_DEV_URL }}
              with:
                context: ./server
                push: true
                tags: |
                    ${{ vars.DOCKERHUB_USERNAME }}/87-0-backend:latest
                    ${{ vars.DOCKERHUB_USERNAME }}/87-0-backend:${{ github.sha }}

            - name: Build frontend image
              uses: docker/build-push-action@v7
              with:
                context: ./client
                push: true
                tags: |
                    ${{ vars.DOCKERHUB_USERNAME }}/87-0-frontend:latest
                    ${{ vars.DOCKERHUB_USERNAME }}/87-0-frontend:${{ github.sha }}
    
    deploy:
        needs: build
        runs-on: ubuntu-latest

        steps:
            - name: Deploy to droplet
              uses: appleboy/ssh-action@v1.2.5
              with:
                host: ${{ secrets.DROPLET_IP }}
                username: ${{ secrets.DROPLET_USER }}
                key: ${{ secrets.DROPLET_SSH_KEY }}
                script: |
                    cd ../opt/87-0
                    docker compose pull
                    docker compose up -d


