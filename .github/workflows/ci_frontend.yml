name: CI-frontend

on:
  push:
    paths:
      - "client/**"
      - ".github/workflows/ci_frontend.yml"
    branches-ignore:
      - main
      - email
  pull_request:
    branches-ignore:
      - main
      - email

concurrency:
  group: development-frontend
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
    
      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json
        
      - name: Install dependencies
        working-directory: client
        run: npm ci

      - name: Audit dependencies
        working-directory: client
        run: npm audit
        
      - name: Run typecheck
        working-directory: client
        run: npm run tsc
        
      - name: Run linting
        working-directory: client
        run: npm run lint

      - name: Check formatting
        working-directory: client
        run: npx prettier . --check
        
      - name: Run tests
        working-directory: client
        run: npm run test